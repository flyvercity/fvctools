$schema: "https://json-schema.org/draft/2020-12/schema"
$title: "Flyvercity Data Format Schema"
$comment: "Schema version 1.0 - Enhanced with documentation fields for automatic documentation generation"

LOCATION: &LOCATION
  $title: "Geographic Location"
  type: object
  properties:
    lat:
      type: number
      description: "Latitude in WGS-84"
      examples: [55.7558, -74.0060]
    lon:
      type: number
      description: "Longitude in WGS-84"
      examples: [37.6176, 40.7128]
    alt:
      type: number
      description: "Ellipsoidal altitude"
      examples: [100.5, 250.0]
    amsl:
      type: number
      description: "Altitude above mean sea level"
      examples: [95.2, 245.8]
    height:
      type: number
      description: "Local height above ground"
      examples: [10.5, 25.0]
    bear:
      type: number
      description: "Bearing angle in degrees clockwise from the true north"
      examples: [45.0, 180.0, 270.0]
    gspeed:
      type: number
      description: "Ground speed in meters per second"
      examples: [15.5, 50.0, 120.0]
  required:
    - lat
    - lon
  additionalProperties: false

POLAR: &POLAR
  $title: "Polar Coordinates"
  type: object
  properties:
    bear:
      type: number
      description: "Bearing angle in degrees clockwise from the true north"
      examples: [0.0, 90.0, 180.0, 270.0]
    elev:
      type: number
      description: "Elevation angle in degrees above horizon"
      examples: [0.0, 15.0, 45.0, 90.0]
  additionalProperties: false

POLAR_SENSOR: &POLAR_SENSOR
  $title: "Polar Sensor Payload"
  type: object
  properties:
    source:
      type: string
      description: "Source of the polar sensor"
      enum:
        - nmea
      examples: ["nmea"]
    origin:
      type: string
      description: "Original file name or originating system"
      examples: ["flight_data_20231201.log", "radar_system_alpha"]
    loc:
      description: "Geographic location of the polar sensor"
      allOf: [*LOCATION]
  required:
    - loc
  additionalProperties: false

IDENTIFICATION: &IDENTIFICATION
  $title: "Aircraft Identification"
  type: object
  properties:
    int:
      type: string
      description: "Source-internal identifier"
      examples: ["FL001", "AC-12345"]
    fvc:
      type: string
      description: "Flyvercity unique identifier"
      examples: ["fvc-abc123", "fvc-xyz789"]
    icaohex:
      type: string
      description: "ICAO 24-bit address"
      examples: ["ABC123", "4CA123"]
    icaoreg:
      type: string
      description: "ICAO registration"
      examples: ["N123AB", "G-ABCD"]
    atm:
      type: string
      description: "ATM callsign"
      examples: ["UAL123", "BAW456"]
    ip:
      type: string
      description: "IP address"
      examples: ["192.168.1.100", "10.0.0.5"]
    imei:
      type: string
      description: "IMEI (International Mobile Equipment Identity) number"
      examples: ["123456789012345", "987654321098765"]
    imsi:
      type: string
      description: "IMSI (International Mobile Subscriber Identity) number"
      examples: ["310150123456789", "310260987654321"]
  anyOf:
    - required:
        - int
    - required:
        - fvc
  additionalProperties: false

CONTENT: &CONTENT
  $title: "Content Type"
  type: string
  description: "Current file content descriptor"
  enum:
    - flightlog
    - radarlog
    - fusion.replay
    - capture.message

METADATA: &METADATA
  $title: "File Metadata"
  type: object
  properties:
    content:
      description: "Content type or array of content types"
      oneOf:
        - allOf: [*CONTENT]
        - type: array
          items: 
            allOf: [*CONTENT]
    source:
      type: string
      description: "Original data format"
      enum:
        - airlink
        - courageous
        - csgroup
        - nmea
        - senhive
        - robinradar
        - safirmqtt
        - fusion.replay
        - artlog
        - datcon
        - agentfly
        - gnettrack
        - mqtt
        - ulog
        - fvcgen
      examples: ["nmea", "safirmqtt", "fusion.replay"]
    origin:
      type: string
      description: "Original file name or originating system"
      examples: ["flight_data_20231201.log", "radar_system_alpha"]
    polar_sensor:
      description: "Polar sensor configuration"
      allOf: [*POLAR_SENSOR]
    cycle_length:
      type: number
      description: "Cycle length in milliseconds"
      examples: [1000]
  required:
    - content

ATTITUDE: &ATTITUDE
  $title: "Aircraft Attitude"
  type: object
  properties:
    roll:
      type: number
      description: "Roll angle in degrees"
      examples: [-30.0, 0.0, 15.5]
    pitch:
      type: number
      description: "Pitch angle in degrees"
      examples: [-10.0, 0.0, 20.0]
    yaw:
      type: number
      description: "Yaw angle in degrees"
      examples: [0.0, 90.0, 180.0, 270.0]
  required:
    - roll
    - pitch
    - yaw
  additionalProperties: false

POSITION: &POSITION
  $title: "Aircraft Position"
  type: object
  properties:
    loc:
      description: "Geographic location of the aircraft"
      allOf: [*LOCATION]
    att:
      description: "Aircraft attitude information"
      allOf: [*ATTITUDE]
  required:
    - loc
  additionalProperties: false

RADAR_POSITION: &RADAR_POSITION
  $title: "Radar Position"
  type: object
  properties:
    loc:
      description: "Polar coordinates for radar position"
      allOf: [*POLAR]
  required:
    - loc
  additionalProperties: false

TIMESTAMP: &TIMESTAMP
  $title: "Timestamp"
  type: object
  properties:
    unix:
      type: number
      description: "Unix timestamp in milliseconds"
      examples: [1756033206882]
    original:
      type: string
      description: "Original timestamp string"
      examples: ["2025-01-01 12:00:00", "2025-01-01 12:00:00.123"]
  required:
    - unix
  optional:
    - original
  additionalProperties: false

CELLULAR_SIGNAL: &CELLULAR_SIGNAL
  $title: "Cellular Signal Information"
  type: object
  properties:
    radio:
      type: string
      description: "Radio technology type"
      enum:
        - Unknown
        - 2G3G
        - 4GLTE
        - 5GNSA
        - 5GNR
      examples: ["4GLTE"]
    rsrp:
      type: number
      description: "Reference Signal Received Power (dBm)"
      examples: [-80]
    rsrq:
      type: number
      description: "Reference Signal Received Quality (dB)"
      examples: [-10]
    rssi:
      type: number
      description: "Received Signal Strength Indicator (dBm)"
      examples: [-70]
    sinr:
      type: number
      description: "Signal-to-Interference-plus-Noise Ratio (dB)"
      examples: [10, 15, 20]
    csi-rsrp:
      type: number
      description: "CSI Reference Signal Received Power (dBm)"
      examples: [-85, -105, -125]
    csi-rsrq:
      type: number
      description: "CSI Reference Signal Received Quality (dB)"
      examples: [-12, -17, -22]
    csi-rssi:
      type: number
      description: "CSI Received Signal Strength Indicator (dBm)"
      examples: [-75, -95, -115]
    csi-sinr:
      type: number
      description: "CSI Signal-to-Interference-plus-Noise Ratio (dB)"
      examples: [8, 13, 18]
    ss-rsrp:
      type: number
      description: "Synchronization Signal Reference Signal Received Power (dBm)"
      examples: [-82, -102, -122]
    ss-rsrq:
      type: number
      description: "Synchronization Signal Reference Signal Received Quality (dB)"
      examples: [-11, -16, -21]
    ss-rssi:
      type: number
      description: "Synchronization Signal Received Signal Strength Indicator (dBm)"
      examples: [-72, -92, -112]
    ss-sinr:
      type: number
      description: "Synchronization Signal Signal-to-Interference-plus-Noise Ratio (dB)"
      examples: [9, 14, 19]
    arfcn:
      type: number
      description: "Absolute Radio Frequency Channel Number"
      examples: [100, 500, 1000]
    band:
      type: string
      description: "Frequency band identifier"
      examples: ["B1", "B3", "B7", "n78"]
    cgi:
      type: string
      description: "Cell Global Identity"
      examples: ["310-150-123456-789", "310-260-987654-321"]
    plmnid:
      type: string
      description: "Public Land Mobile Network Identifier"
      examples: ["310-150", "310-260"]
    plmnname:
      type: string
      description: "Public Land Mobile Network Name"
      examples: ["Verizon", "AT&T", "T-Mobile"]
  additionalProperties: false

FLIGHTLOG: &FLIGHTLOG
  $title: "Flight Log Entry"
  type: object
  properties:
    origin:
      type: string
      description: "Originating system"
      examples: ["airlink", "courageous", "nmea"]
    time:
      description: "Timestamp of the flight log entry"
      allOf: [*TIMESTAMP]
    uaid:
      description: "Unique aircraft identification"
      allOf: [*IDENTIFICATION]
    pos:
      description: "Aircraft position and attitude"
      allOf: [*POSITION]
    cellsig:
      description: "Cellular signal information"
      allOf: [*CELLULAR_SIGNAL]
    datalink:
      type: object
      description: "Data link performance metrics"
      properties:
        rtt:
          type: number
          description: "Round-trip time in milliseconds"
          examples: [50, 100, 200]
        loss:
          type: boolean
          description: "Packet loss flag"
          examples: [true, false]
      additionalProperties: false
    metadata:
      type: object
      description: "Additional metadata"
  required:
    - time
    - pos
  additionalProperties: false

RADARLOG: &RADARLOG
  $title: "Radar Log Entry"
  type: object
  properties:
    origin:
      type: string
      description: "Originating system"
      examples: ["robinradar", "csgroup", "senhive"]
    time:
      description: "Timestamp of the radar log entry"
      allOf: [*TIMESTAMP]
    uaid:
      description: "Unique aircraft identification"
      allOf: [*IDENTIFICATION]
    pos:
      description: "Radar position information"
      allOf: [*RADAR_POSITION]
  required:
    - time
    - pos
  additionalProperties: false

FUSION_REPLAY: &FUSION_REPLAY
  $title: "Fusion Replay Event"
  type: object
  properties:
    event:
      type: string
      description: "Event type"
      enum:
        - launch
        - start
        - stop
        - input
        - output
        - error
      examples: ["start", "input", "output"]
    cycle:
      type: number
      description: "Cycle number"
      examples: [1, 100, 1000]
    origin:
      type: string
      description: "Originating network or system"
      examples: ["safesky"]
    message:
      type: object
      description: "Event message payload"
    metadata:
      type: object
      description: "Event metadata"
  required:
    - event
    - cycle
  additionalProperties: false

CAPTURE_MESSAGE: &CAPTURE_MESSAGE
  $title: "Captured Message"
  type: object
  description: "Messages captured from MQTT topics (other sources may be added in the future)"
  properties:
    mqtt:
      type: object
      description: "MQTT Metadata"
      properties:
        time:
          description: "MQTT message timestamp"
          allOf: [*TIMESTAMP]
        topic:
          type: string
          description: "MQTT topic"
          examples: ["/aircraft/position", "/radar/track", "/system/status"]
      required:
        - time
        - topic
      additionalProperties: false
  required:
    - mqtt
  additionalProperties: true

CONTENT_SCHEMA:
  flightlog: *FLIGHTLOG
  radarlog: *RADARLOG
  fusion.replay: *FUSION_REPLAY 
  capture.message: *CAPTURE_MESSAGE
