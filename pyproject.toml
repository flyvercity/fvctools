[project]
name = "fvctools"
version = "1.4.0"
description = "Flyvercity CLI Tools Suite"
authors = [
    { name = "Boris Resnick", email = "boris@flyver.city" }
]
dependencies = [
    "pyparsing>=3.2.0",
    "toolz>=1.0.0",
    "jsonschema>=4.23.0",
    "pygeodesy>=24.11.11",
    "scipy>=1.14.1",
    "pynmea2>=1.19.0",
    "python-dateutil>=2.9.0.post0",
    "gitpython>=3.1.43",
    "click>=8.1.7",
    "simplekml>=1.3.6",
    "boto3>=1.35.76",
    "pandas>=2.2.3",
    "geopandas>=1.0.1",
    "python-benedict[s3,toml,yaml]>=0.34.1",
    "pyyaml>=6.0.2",
    "botobuddy>=0.3.6",
    "pyulog>=1.2.2",
    "jinja2>=3.1.0",
    "rich>=14.0.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[tool.uv]
package = true

[project.scripts]
fvc = "fvc.tools.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.2.0",
    "ptpython>=3.0.30",
    "ruff>=0.14.0",
    "twine>=6.1.0",
]

[tool.ruff]
line-length = 80
src = ["src"]

[tool.ruff.format]
# Expand readability a bit.
quote-style = "single"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Avoid rules that fight the formatter or push compactness.
ignore = [
  "COM812",     # Trailing comma nitpicks
  "ISC001",     # Implicit str concat strictness
  "C4",         # flake8-comprehensions (keeps simple loops acceptable)
]

# Treat `_` and `_unused`-style names as intentional.
dummy-variable-rgx = "^(_+|unused_.*)$"
